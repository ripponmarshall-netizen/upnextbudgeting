<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; object-src 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0c0e">
    <meta name="description" content="A payday-to-payday budget for bills, spending, and what is safe to spend.">
    <meta name="application-name" content="UpNextBudgeting">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="UpNext">
    <meta name="format-detection" content="telephone=no">
    <title>UpNextBudgeting</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="icon" href="assets/icon-192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css?v=2">
  </head>
  <body>
    <main id="app" class="screen"></main>

    <nav class="tabbar" id="tabbar" aria-label="Primary">
      <button class="tab" data-tab="home" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-5.5v-5.5h-5V20H4z"/></svg>
        <span>Home</span>
      </button>
      <button class="tab" data-tab="budget" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5H12z"/><path d="M15 3.8A8.5 8.5 0 0 1 20.2 9H15z"/></svg>
        <span>Budget</span>
      </button>
      <button class="tab-add" data-action="add" type="button" aria-label="Add expense or bill">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="tab" data-tab="bills" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12v17l-3-2-3 2-3-2-3 2z"/><path d="M9 8.5h6M9 12.5h6"/></svg>
        <span>Bills</span>
      </button>
      <button class="tab" data-tab="activity" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span>Activity</span>
      </button>
    </nav>

    <dialog id="sheet" class="sheet" aria-labelledby="sheetTitle">
      <div class="sheet-panel">
        <header class="sheet-head">
          <h2 id="sheetTitle"></h2>
          <button class="icon-btn" data-action="close-sheet" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </header>
        <div id="sheetBody" class="sheet-body"></div>
      </div>
    </dialog>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="app.js?v=2" type="module"></script>
  </body>
</html>
